[package]
name = "dioxusap"
version = "0.1.1"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/techton7/dioxusap"
authors = ["Techton <contact@techton.io>"]
description = "Type-safe, high-performance GSAP animation platform and timeline sequencer for Dioxus."
readme = "README.md"
keywords = ["dioxus", "gsap", "animation", "motion", "timeline"]
categories = ["gui", "visualization", "multimedia"]

[dependencies]
dioxus = { version = "0.7.0", default-features = false, features = ["hooks", "signals", "macro", "html"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[dev-dependencies]
dioxus = { version = "0.7.0", default-features = false, features = ["minimal"] }
